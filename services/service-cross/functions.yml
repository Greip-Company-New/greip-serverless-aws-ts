EMAIL_LMB:
    handler: dist/email-lmb/app.handler
    name: ${self:custom.config.lambdaPrefix.${self:custom.stageDeploy}}-EMAIL
    description: Lambda generica de envio de correos (SES) para notificaciones de GREIP COMPANY
    layers:
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-common:${self:custom.config.lyCommonNew.${self:custom.stageDeploy}}
    package:
      patterns:
        - 'dist/email-lmb/**/*.js'
        - 'dist/email-lmb/**/*.ts'
    events:
      - http:
          path: /cross/email
          method: post
          integration: lambda
          private: true
          cors: ${file(config/serverless/http-cors.yml)}
          request:
            template:
              application/json: ${file(config/serverless/request/src/email-lmb/enviarEmail.vm)}
          response: ${file(config/serverless/http-response.yml)}

