service: service-cross
frameworkVersion: '4'

build: false

plugins:
  - serverless-domain-manager
  - serverless-offline

package:
  individually: true
  patterns:
    - '!**'
    - 'dist/util/**/*.js'
    - 'dist/util/**/*.ts'
    - '!dist/**/*.js.map'

custom:
  name: SRV-CROSS
  path: srv-cross
  defaultStage: ${opt:stage, 'DEV'}
  stageDeploy: ${opt:stage, 'DEV'}
  config: ${file(serverless-config.yml)}
  customDomain:
    domainName: ${self:custom.config.domains.${self:custom.stageDeploy}}
    basePath: ${self:custom.path}
    stage: ${self:custom.stageDeploy}
    createRoute53Record: false
    certificateArn: arn:aws:acm:us-east-2:918897411288:certificate/606bea7a-80f8-413e-8242-0d8664c357f9
    endpointType: 'regional'
    securityPolicy: tls_1_2
    apiType: rest
    autoDomain: false

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${self:custom.stageDeploy}
  region: ${self:custom.config.regions.code.${self:custom.stageDeploy}}
  profile: ${self:custom.config.profile.${self:custom.stageDeploy}}
  timeout: 28
  memorySize: 256
  logRetentionInDays: 30
  apiGateway:
    apiKeys:
      - APIKEY-${self:custom.stageDeploy}-${self:custom.name}
    usagePlan:
      quota:
        limit: 1000000
        offset: 2
        period: MONTH
      throttle:
        burstLimit: 100
        rateLimit: 50
  # service-cross NO va en VPC: solo llama APIs publicas (SES/SNS).
  # Las Lambdas en subred privada no tienen NAT ni endpoints de SES/SNS.
  tracing:
    apiGateway: true
    lambda: true
  tags:
    OWNER: GREIP-COMPANY
    RESPONSIBLE: RCHANG
    NAME: ${self:custom.name}
    STAGE: ${self:provider.stage}
    SERVICE: ${self:service}
  role: arn:aws:iam::${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:role/lambda-vpc-role

  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    SDK_AWS_REGION: ${self:provider.region}
    BUCKET: ${self:custom.config.bucketDeploy.${self:custom.stageDeploy}}
    LAMBDA_PREFIX: ${self:custom.config.lambdaPrefix.${self:custom.stageDeploy}}
    PROFILE_DEPLOYMENT: ${self:provider.profile}
    AWS_ACCOUNT: ${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}
    SM_ENCRIPTACION_GREIP: 'Greip/Encriptacion'
    SM_JWT_PUBLIC_KEY: 'Greip/JWT-Public'
    SM_ENCRIPTACION_TOKEN: 'Greip/Encriptacion/Token'
    SM_THIRDPARTY_PREFIX: 'Greip/ThirdParty'
    SES_FROM_EMAIL: 'no-reply@greip.com.pe'
    SES_FROM_NAME: 'GREIP COMPANY APP'
    LMB_SHORTLINK: ${self:custom.config.lmbShortlink.${self:custom.stageDeploy}}

functions: ${file(functions.yml)}
