CONFIG_LMB:
    handler: dist/config-lmb/app.handler
    name: ${self:custom.config.lambdaPrefix.${self:custom.stageDeploy}}-CONFIG
    description: Lambda de configuracion de proveedores de notificacion (Brevo/Twilio) por tenant de GREIP COMPANY
    layers:
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-common:${self:custom.config.lyCommonNew.${self:custom.stageDeploy}}
    package:
      patterns:
        - 'dist/config-lmb/**/*.js'
        - 'dist/config-lmb/**/*.ts'
        - 'dist/common/**/*.js'
        - 'dist/common/**/*.ts'
    events:
      - http:
          path: /thyrd/config
          method: get
          integration: lambda
          private: true
          cors: ${file(config/serverless/http-cors.yml)}
          request:
            template:
              application/json: ${file(config/serverless/request/src/config-lmb/getConfig.vm)}
          response: ${file(config/serverless/http-response.yml)}
      - http:
          path: /thyrd/config
          method: put
          integration: lambda
          private: true
          cors: ${file(config/serverless/http-cors.yml)}
          request:
            template:
              application/json: ${file(config/serverless/request/src/config-lmb/setConfig.vm)}
          response: ${file(config/serverless/http-response.yml)}

