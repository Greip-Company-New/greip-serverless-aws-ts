# Utilidad de bootstrap: crea el rol ADMIN con todos los permisos y el usuario
# administrador inicial. Sin evento HTTP; se invoca manualmente por CLI.
BOOTSTRAP_LMB:
    handler: dist/bootstrap/handler.handler
    name: ${self:custom.config.lambdaPrefix.${self:custom.stageDeploy}}-BOOTSTRAP
    description: Utilidad de bootstrap de usuarios y RBAC de GREIP COMPANY (invocacion manual)
    timeout: 120
    memorySize: 1024
    layers:
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-common:${self:custom.config.lyCommonNew.${self:custom.stageDeploy}}
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-postgresdb:${self:custom.config.lyPgNew.${self:custom.stageDeploy}}
    package:
      patterns:
        - 'dist/bootstrap/**/*.js'
        - 'dist/bootstrap/**/*.ts'
        - 'dist/common/**/*.js'
        - 'dist/common/**/*.ts'

# Procesador del DynamoDB Stream de USUARIOS (NEW_AND_OLD_IMAGES).
# Escribe los cambios de usuario en la tabla de auditoria.
AUDIT_STREAM_LMB:
    handler: dist/audit-lmb/stream.handler
    name: ${self:custom.config.lambdaPrefix.${self:custom.stageDeploy}}-AUDIT-STREAM
    description: Procesador del DynamoDB Stream de USUARIOS de GREIP COMPANY (auditoria de cambios)
    layers:
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-common:${self:custom.config.lyCommonNew.${self:custom.stageDeploy}}
    package:
      patterns:
        - 'dist/audit-lmb/**/*.js'
        - 'dist/audit-lmb/**/*.ts'
        - 'dist/common/**/*.js'
        - 'dist/common/**/*.ts'
    events:
      - stream:
          type: dynamodb
          arn: ${self:custom.config.dynamoStreamUsuarios.${self:custom.stageDeploy}}
          batchSize: 10
          startingPosition: TRIM_HORIZON
          maximumRetryAttempts: 5
          bisectBatchOnFunctionError: true
          maximumRecordAgeInSeconds: 86400

# Microservicio de auditoria de entidades: persiste el historial de cambios
# (crear/actualizar/eliminar) de cualquier entidad en greip.entity_change_log.
# registerChange es invocado por Lambda-to-Lambda desde los servicios;
# listChanges expone la consulta por entity + entityKey + tenantId via HTTP.
ENTITY_AUDIT_LMB:
    handler: dist/entity-audit-lmb/app.handler
    name: ${self:custom.config.lambdaPrefix.${self:custom.stageDeploy}}-ENTITY-AUDIT
    description: Microservicio de auditoria de cambios de entidades de GREIP COMPANY (historico generico en PostgreSQL)
    layers:
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-common:${self:custom.config.lyCommonNew.${self:custom.stageDeploy}}
      - arn:aws:lambda:${self:provider.region}:${self:custom.config.idAwsAccount.${self:custom.stageDeploy}}:layer:ly-nodejs-ts-postgresdb:${self:custom.config.lyPgNew.${self:custom.stageDeploy}}
    package:
      patterns:
        - 'dist/entity-audit-lmb/**/*.js'
        - 'dist/entity-audit-lmb/**/*.ts'
        - 'dist/common/**/*.js'
        - 'dist/common/**/*.ts'
    events:
      - http:
          path: /entity-audit
          method: get
          integration: lambda
          private: true
          cors: ${file(config/serverless/http-cors.yml)}
          request:
            template:
              application/json: ${file(config/serverless/request/src/entity-audit-lmb/listChanges.vm)}
          response: ${file(config/serverless/http-response.yml)}
